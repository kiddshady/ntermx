<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Neon Terminal</title>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="strop-tokens.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- Titlebar: dots, tabs, nueva shell y controles de ventana.
         Lo que no es interactivo queda como región de arrastre. -->
    <div id="titlebar">
      <span class="brand-dots">
        <span class="dot c"></span>
        <span class="dot m"></span>
        <span class="dot y"></span>
      </span>

      <div id="tabs"></div>

      <div class="new-tab" id="new-tab" data-tip="Nueva shell (Ctrl+Shift+T)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </div>

      <div class="win-controls">
        <div class="win-btn" id="win-min" data-tip="Minimizar">
          <svg width="13" height="13" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </div>
        <div class="win-btn close" id="win-close" data-tip="Cerrar (va al tray)">
          <svg width="13" height="13" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </div>
      </div>
    </div>

    <!-- Main: terminales (una por tab, sólo se ve la activa) + status bar -->
    <div id="main">
      <div id="terminal-container"></div>
      <div id="status-bar">
        <span class="cwd" id="status-cwd">~</span>
        <span class="spacer"></span>
        <span class="shell" id="status-shell">pwsh</span>
        <span class="time" id="status-time">--:--:--</span>
      </div>
    </div>
  </div>

  <!-- CRT scanlines + vignette overlay (cubre toda la app) -->
  <div id="crt-overlay"></div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="../../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="../../node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
